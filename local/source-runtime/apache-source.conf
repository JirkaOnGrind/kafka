Alias /admin-source /var/www/html/guzg3arkfjazszdr
<Directory /var/www/html>
    AllowOverride None
    Options -Indexes
    Require all granted
    RewriteEngine On
    RewriteCond %{QUERY_STRING} (^|&)(controller=(orderopc|authentication|contact|password)|fc=module)(&|$) [NC]
    RewriteRule ^ - [F]
    # Block all standalone PHP entrypoints except the front controller.
    <FilesMatch "(?i)\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
    <FilesMatch "^(settings\.inc\.php|.*\.sql|.*\.log)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/guzg3arkfjazszdr>
    <FilesMatch "^(ajax-tab|pdf)\.php$">
        Require all granted
    </FilesMatch>
</Directory>
<LocationMatch "^/(config|cache|log|upload|download|tools|webservice|override|modules)/">
    Require all denied
</LocationMatch>
# Presentation assets are safe to serve; module PHP entrypoints remain denied.
<LocationMatch "(?i)^/modules/(?!.*\.php(?:[./]|$))(?:[^/]+/)+[^/]+\.(?:png|jpe?g|gif|webp|avif|svg|ico|css|js|woff2?|ttf|eot)$">
    Require all granted
</LocationMatch>
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
Header always set Content-Security-Policy "default-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-src 'none'"
