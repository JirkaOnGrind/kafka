name: kafka-local
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kafka
      MYSQL_USER: kafka
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run start.bat first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run start.bat first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 40
  shop:
    image: prestashop/prestashop:9.1.5-5.0-classic-8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:80'
    environment:
      DB_SERVER: db
      DB_NAME: kafka
      DB_USER: kafka
      DB_PASSWD: ${DB_PASSWORD}
      PS_INSTALL_AUTO: '1'
      PS_ERASE_DB: '0'
      PS_DOMAIN: localhost:8080
      PS_FOLDER_ADMIN: admin-dev
      PS_FOLDER_INSTALL: install-kafka
      PS_LANGUAGE: cs
      PS_COUNTRY: CZ
      PS_ALL_LANGUAGES: '0'
      PS_DEV_MODE: '1'
      PS_ENABLE_SSL: '0'
      ADMIN_MAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
    volumes:
      - shopfiles:/var/www/html
      - ./prestashop/themes/hummingbird:/var/www/html/themes/hummingbird
      - ./prestashop/themes/kafka:/var/www/html/themes/kafka
      - ./prestashop/modules/kafkahome:/var/www/html/modules/kafkahome
  reference:
    image: nginx:alpine
    ports:
      - '127.0.0.1:4173:80'
    volumes:
      - ./local/reference.conf:/etc/nginx/conf.d/default.conf:ro
      - ./graficky_navrh/index.html:/usr/share/nginx/html/index.html:ro
      - ./graficky_navrh/product.html:/usr/share/nginx/html/product.html:ro
      - ./graficky_navrh/product.css:/usr/share/nginx/html/product.css:ro
      - ./graficky_navrh/product.js:/usr/share/nginx/html/product.js:ro
      - ./graficky_navrh/app.js:/usr/share/nginx/html/app.js:ro
      - ./graficky_navrh/theme-system.js:/usr/share/nginx/html/theme-system.js:ro
      - ./graficky_navrh/catalog-data.js:/usr/share/nginx/html/catalog-data.js:ro
      - ./graficky_navrh/catalog-live.generated.js:/usr/share/nginx/html/catalog-live.generated.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
volumes:
  database:
  shopfiles:
