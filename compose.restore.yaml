# Used only by scripts/restore-rehearsal.ps1 with a fresh kafka-restore-* project.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kafka
      MYSQL_USER: kafka
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing backup credentials}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Missing backup credentials}
    volumes:
      - database:/var/lib/mysql
      - ${KAFKA_BACKUP_PATH:?Missing backup path}:/backup:ro
      - ./scripts/import-restore.sh:/rehearsal/import.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 3s
      timeout: 5s
      retries: 60
  shop:
    image: prestashop/prestashop:9.1.5-5.0-classic-8.3-apache
    entrypoint: [apache2-foreground]
    environment:
      DB_SERVER: db
      DB_NAME: kafka
      DB_USER: kafka
      DB_PASSWD: ${DB_PASSWORD}
    volumes:
      - type: volume
        source: shopfiles
        target: /var/www/html
        volume:
          nocopy: true
      - ${KAFKA_BACKUP_PATH}:/backup:ro
      - ./scripts/configure-restore.php:/rehearsal/configure.php:ro
  preview:
    image: nginx:alpine
    ports:
      - '127.0.0.1:8081:80'
    volumes:
      - ./local/isolated-preview.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, preview]
volumes:
  database:
  shopfiles:
networks:
  default:
    internal: true
  preview:
